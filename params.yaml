# Hiperparâmetros do modelo. Mudou aqui? O CI treina de novo e confere os limiares.
semente: 42

modelo:
  C: 1.0
  max_iter: 1000
  # pulsar é raro (9%). Peso 5 na classe 1 deixa o recall perto de 0,89 com precisão ~0,88.
  # Com peso 3 o recall ficava em 0,86, colado no limiar de 0,85.
  class_weight:
    0: 1
    1: 5
